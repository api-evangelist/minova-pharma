description: 'Nanjing Minova Pharmaceutical Technology Co., Ltd. (南京迈诺威医药科技有限公司) is a
  drug-discovery and pharmaceutical R&D company founded in February 2021 and headquartered
  in Nanjing, China. The company focuses on the discovery, development, and industrialization
  of novel drugs for mental diseases and disfiguring (cosmetic/dermatological) diseases,
  operating in the consumer-pharmaceutical space as both a drug R&D house and supplier.
  Its stated capabilities span early drug discovery, compound/drug screening, and druggability
  (developability) research. Surfaced as a portfolio company of IDG Capital and added to
  the API Evangelist network. Minova Pharma publishes a corporate marketing website but
  exposes no public developer portal, API, SDK, or machine-readable interface.'
